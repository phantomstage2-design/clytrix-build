name: Build CLYTRIX APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build CLYTRIX
        shell: bash
        run: |
          exec > >(tee build-log.txt) 2>&1
          set -o pipefail
          echo "Run ${GITHUB_RUN_NUMBER} at $(date -u)"
          echo "ANDROID_HOME=${ANDROID_HOME}"
          unzip -q -o CLYTRIX_Project.zip -d src
          cd src/clytrix
          chmod +x gradlew
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew :app:assembleDebug --stacktrace --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "${GITHUB_WORKSPACE}/CLYTRIX.apk"
          echo "BUILD OK"
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CLYTRIX-apk
          path: CLYTRIX.apk
      - name: Save log and APK to the build-results branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/results
          cp build-log.txt /tmp/results/ 2>/dev/null || echo "The build step did not start" > /tmp/results/build-log.txt
          cp CLYTRIX.apk /tmp/results/ 2>/dev/null || true
          cd /tmp/results
          git init -q
          git checkout -q -b build-results
          git config user.name "clytrix-build-bot"
          git config user.email "clytrix-build-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_RUN_NUMBER}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-results
